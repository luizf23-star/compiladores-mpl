name: Gerar evidencias Entrega 3
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/e3-evidencia.yml

permissions:
  contents: write

jobs:
  verificacao:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Executar verificacao E3
        id: teste
        shell: bash
        run: |
          mkdir -p evidencias
          set +e
          python3 verificar.py 3 > evidencias/verificacao-3.txt 2>&1
          status=$?
          set -e
          cat evidencias/verificacao-3.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Salvar evidencia no repositorio
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidencias/verificacao-3.txt
          if ! git diff --cached --quiet; then
            git commit -m "Registra evidencia real da verificacao da E3"
            git push
          fi
      - name: Sinalizar resultado
        shell: bash
        run: |
          test "${{ steps.teste.outputs.status }}" = "0"
